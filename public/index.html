function shade(hex,amt){const n=parseInt(hex.slice(1,7),16);const r=clamp((n>>16)+amt,0,255),g=clamp(((n>>8)&255)+amt,0,255),b=clamp((n&255)+amt,0,255);return'#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1);}

/* Room transport for the self-hosted website: same interface as Claude's room capability
   (join(name) -> {presence, peers, leave}), carried over a WebSocket to server.js. */
function wsRoomFactory(url){
 const myId=Math.random().toString(36).slice(2,12);const rooms=new Map();let ws=null,ready=false;
 const send=o=>{if(ready&&ws&&ws.readyState===1)ws.send(JSON.stringify(o));};
 function connect(){
  try{ws=new WebSocket(url);}catch(e){setTimeout(connect,1500);return;}
  ws.onopen=()=>{ready=true;for(const[name,r]of rooms){send({t:'join',room:name,peer:myId});send({t:'presence',room:name,data:r.me});}};
  ws.onmessage=ev=>{let m;try{m=JSON.parse(ev.data);}catch(e){return;}const r=rooms.get(m.room);if(!r)return;
   const mk=(peer,data)=>Object.freeze({peer,by:null,isMe:false,sameTab:false,kind:'viewer',guest:false,presence:Object.freeze(data||{}),updatedAt:Date.now()});
   if(m.t==='snap'){r.others.clear();for(const p of m.peers||[])if(p.peer!==myId)r.others.set(p.peer,mk(p.peer,p.data));}
   else if(m.t==='p'&&m.peer!==myId)r.others.set(m.peer,mk(m.peer,m.data));
   else if(m.t==='left')r.others.delete(m.peer);};
  ws.onclose=()=>{ready=false;setTimeout(connect,1200);};
  ws.onerror=()=>{};
 }
 connect();
 return{join:async name=>{
  if(rooms.has(name))return rooms.get(name).api;
  const r={me:{},others:new Map()};
  r.api={name,
   presence:async patch=>{for(const k in patch){if(patch[k]===null)delete r.me[k];else r.me[k]=patch[k];}send({t:'presence',room:name,data:r.me});},
   peers:()=>[Object.freeze({peer:myId,by:null,isMe:true,sameTab:true,kind:'viewer',guest:false,presence:r.me,updatedAt:0}),...r.others.values()],
   leave:async()=>{send({t:'leave',room:name});rooms.delete(name);},
   connected:()=>ready};
  rooms.set(name,r);send({t:'join',room:name,peer:myId});return r.api;}};
}

function netHost(){
 if(!ROOMN)return;
 const guests=guestPeers();
 if(state==='hostLobby'){
  slots=slots.filter(id=>guests.some(g=>g.peer===id));

 if(o.hzcd>0)return;o.hzcd=40;const pp=P;P=null;hurtEnemy(o,dmg*3,kx*6,ky*6);P=pp;
}
function updateHazard(f){
 const k=HZ.k;
 if(k==='sprinkler'){HZ.a+=0.022*f;
  for(const{o,cat}of everyone()){const dx=o.x-SPR.x,dy=o.y-SPR.y,d=Math.hypot(dx,dy);if(d<230&&d>10){let da=Math.atan2(dy,dx)-HZ.a;da=Math.atan2(Math.sin(da),Math.cos(da));
   if(Math.abs(da)<0.22){o.x+=dx/d*2.4*f;o.y+=dy/d*2.4*f;if(cat&&Math.random()<0.015*f)floatText('Splash!',o.x,o.y-40,'#9fd8ff',14);}}}}
 if(k==='tide'){HZ.n-=f;
  if(HZ.n<=130&&HZ.n+f>130){banner={txt:'🌊 Big wave coming!',sub:'It washes in free yarn',t:90};snd(200,0.5,'sine',0.05,-100);}
  if(HZ.n<=0){if(HZ.x<-500)HZ.x=AX0-90;HZ.x+=6*f;
   for(const{o,cat}of everyone()){if(Math.abs(o.x-HZ.x)<55){o.x+=4.5*f;if(!cat)o.stun=Math.max(o.stun,12);}}
   if(HZ.x>AX1+90){HZ.x=-999;HZ.n=rand(650,850);for(let j=0;j<3;j++)addPickup('yarn',rand(AX0+60,AX0+320),rand(AY0+40,AY1-40));addPickup('fish',rand(AX0+60,AX0+320),rand(AY0+40,AY1-40));}}}
 if(k==='tractor'){HZ.n-=f;
  if(HZ.n<=150&&HZ.w===0){HZ.w=1;HZ.y=rand(AY0+50,AY1-50);HZ.d=Math.random()<0.5?1:-1;snd(140,0.4,'square',0.04);}
  if(HZ.n<=0){if(HZ.w===1){HZ.x=HZ.d>0?AX0-80:AX1+80;HZ.w=2;}HZ.x+=HZ.d*8.5*f;
   if(Math.random()<0.4)parts.push({x:HZ.x-HZ.d*30,y:HZ.y-58,vx:-HZ.d*0.5,vy:-1,life:30,col:'#6a6a70',s:4});
   for(const{o,cat}of everyone()){if(Math.abs(o.y-HZ.y)<36&&Math.abs(o.x-HZ.x)<52)hazardHit(o,cat,cat?16:30,HZ.d*1.5,(o.y<HZ.y?-1:1)*1.5);}
   if((HZ.d>0&&HZ.x>AX1+90)||(HZ.d<0&&HZ.x<AX0-90)){HZ.x=-999;HZ.w=0;HZ.n=rand(520,720);}}}
 if(k==='forest'){HZ.n-=f;
  if(HZ.n<=0){HZ.n=rand(70,130)/Math.sqrt(PS.length);const al=alive();const tg=al[Math.floor(Math.random()*al.length)]||{x:W/2,y:H/2};HZ.c.push({x:clamp(tg.x+rand(-90,90),AX0+20,AX1-20),y:clamp(tg.y+rand(-70,70),AY0+20,AY1-20),t:75});}
  for(const c of HZ.c){c.t-=f;if(c.t<=0&&!c.done){c.done=1;burst(c.x,c.y,'#7a4a20',12,4);snd(160,0.12,'square',0.04,-60);
   for(const{o,cat}of everyone()){const d=Math.hypot(o.x-c.x,o.y-c.y);if(d<34)hazardHit(o,cat,cat?8:10,(o.x-c.x)/(d||1),(o.y-c.y)/(d||1));}}}
  HZ.c=HZ.c.filter(c=>!c.done);}
 if(k==='tires'){HZ.n-=f;
  if(HZ.n<=0){HZ.n=rand(200,320);const d=Math.random()<0.5?1:-1;HZ.tr.push({x:d>0?AX0-30:AX1+30,y:rand(AY0+30,AY1-30),d,h:[]});snd(120,0.2,'triangle',0.03);}
  for(const t of HZ.tr){t.x+=t.d*6*f;for(const{o,cat}of everyone()){const id=cat?'p'+o.id:o.id;if(!t.h.includes(id)&&Math.hypot(o.x-t.x,o.y-t.y)<22+(cat?14:o.r*0.7)){t.h.push(id);hazardHit(o,cat,cat?10:12,t.d*2,0);}}}
  HZ.tr=HZ.tr.filter(t=>t.x>AX0-60&&t.x<AX1+60);}
 if(k==='spikes'){HZ.st+=f;const dur=[170,70,55][HZ.ph];
  if(HZ.st>=dur){HZ.st=0;HZ.ph=(HZ.ph+1)%3;if(HZ.ph===1){HZ.on=[...TRAPS.keys()].sort(()=>Math.random()-0.5).slice(0,5);}if(HZ.ph===2)snd(300,0.1,'square',0.04,200);}
  if(HZ.ph===2)for(const ti of HZ.on){const[x,y]=TRAPS[ti];for(const{o,cat}of everyone()){if(Math.abs(o.x-x)<24&&Math.abs(o.y-y)<24)hazardHit(o,cat,cat?10:8,0,0);}}}
 // kittens
 for(const kt of KITS){if(kt.saved)continue;const p=PS.find(q=>!q.down&&Math.hypot(q.x-kt.x,q.y-kt.y)<30);
  if(p){kt.saved=true;kitsSaved++;bank+=3;score+=50;floatText('Kitten rescued! +3 🧶',kt.x,kt.y-30,'#ffb3d0',18);for(let i=0;i<8;i++)parts.push({x:kt.x+rand(-14,14),y:kt.y-rand(0,20),vx:rand(-.6,.6),vy:-rand(1,2),life:45,col:'#ff7aa8',s:5,heart:true});snd(990,0.1,'triangle',0.05);setTimeout(()=>snd(1320,0.15,'triangle',0.05),100);}}
 for(const b of OBS)if(b.hit>0)b.hit-=f;
}
function packHZ(){const r=v=>Math.round(v*100)/100;const o={};for(const k in HZ){const v=HZ[k];o[k]=typeof v==='number'?r(v):v;}
 if(HZ.tr)o.tr=HZ.tr.map(t=>[Math.round(t.x),Math.round(t.y),t.d]);if(HZ.c)o.c=HZ.c.map(c=>[Math.round(c.x),Math.round(c.y),Math.round(c.t)]);return o;}
function unpackHZ(h){HZ=h||{};if(Array.isArray(HZ.tr))HZ.tr=HZ.tr.map(a=>({x:a[0],y:a[1],d:a[2]}));if(Array.isArray(HZ.c))HZ.c=HZ.c.map(a=>({x:a[0],y:a[1],t:a[2]}));}

function getInput(pl){
 if(pl.remote){
  const pr=ROOMN?ROOMN.peers().find(p=>p.peer===pl.remote):null;const i=pr&&pr.presence&&pr.presence.in;
  if(!i||typeof i!=='object')return{mx:0,my:0,claw:false,yarn:false};
  if(typeof i.sp==='number'){if(pl.last.sp===null)pl.last.sp=i.sp;else if(i.sp>pl.last.sp){pl.last.sp=i.sp;P=pl;special();}}
  if(typeof i.yt==='number'){if(pl.last.yt===null)pl.last.yt=i.yt;else if(i.yt>pl.last.yt){pl.last.yt=i.yt;P=pl;throwYarn(Math.cos(+i.ya||0),Math.sin(+i.ya||0));}}
  return{mx:clamp(+i.mx||0,-1,1),my:clamp(+i.my||0,-1,1),claw:!!i.c,yarn:!!i.y};
 }
 const C=ctrlOf(pl.id),t1=pl.id===0;
 let mx=0,my=0;
 if(held(C,'left'))mx-=1;if(held(C,'right'))mx+=1;if(held(C,'up'))my-=1;if(held(C,'down'))my+=1;
 if(t1&&touch.joy){mx+=touch.jx;my+=touch.jy;}

}
function update(f){
 T+=f;

 if(banner){banner.t-=f;if(banner.t<=0)banner=null;}
 if(shake>0)shake-=f;

 if(waveDelay>0){waveDelay-=f;if(waveDelay<=0)nextWave();if(state!=='play')return;}

 else if(enemies.length===0){waveDelay=100;}

 yarnT-=f;if(yarnT<=0){yarnT=380;if(pickups.filter(p=>p.kind==='yarn').length<3+PS.length)addPickup('yarn',rand(AX0+40,AX1-40),rand(AY0+40,AY1-40),1600);}
 updateHazard(f);if(state!=='play')return;

 for(const pl of PS){if(pl.down)continue;P=pl;
  const inp=getInput(pl);if(pl.down)continue;
  let mx=inp.mx,my=inp.my,len=Math.hypot(mx,my);if(len>1){mx/=len;my/=len;len=1;}
  P.moving=len>0.15;
  if(P.moving){P.ax=mx/len;P.ay=my/len;if(Math.abs(mx)>0.12)P.face=mx>0?1:-1;}
  const sp=(P.spd+(fits[P.id]&&fits[P.id].feet==='booties'?0.25:0))*(P.nip>0?1.25:1)*(inPond(P.x,P.y)?0.5:1);
  if(P.dash>0){P.x+=P.dvx*f;P.y+=P.dvy*f;P.dash-=f;burst(P.x,P.y,P.cat.base,1,1);
   enemies.forEach(e=>{if(e.dashed!==P.id*1000+P.dashId&&Math.hypot(e.x-P.x,e.y-P.y)<e.r+28){e.dashed=P.id*1000+P.dashId;hurtEnemy(e,power()*2.6,P.dvx*0.8,P.dvy*0.8);e.stun=40;}});}
  else{P.x+=mx*sp*f;P.y+=my*sp*f;}
  pushOut(P,14);P.x=clamp(P.x,AX0+16,AX1-16);P.y=clamp(P.y,AY0+16,AY1-16);
  if(P.moving&&inPond(P.x,P.y)&&Math.random()<0.4)parts.push({x:P.x+rand(-10,10),y:P.y+12,vx:rand(-1,1),vy:-rand(.5,1.5),life:14,col:'#cfeaff',s:1.8});
  ['atk','atkAnim','throwCd','inv','shield','frenzy','nip'].forEach(k=>{if(P[k]>0)P[k]-=f;});
  P.sp=Math.min(P.spMax,P.sp+f*0.55*(1+upg.sp*0.4));
  if(inp.claw)claw();
  if(inp.yarn)throwYarn(P.ax,P.ay);
 }

 for(const s of shots){
  s.x+=s.vx*f;s.y+=s.vy*f;s.rot+=0.3*f;s.life-=f;
  if(s.ty==='fire'&&Math.random()<0.6)parts.push({x:s.x+rand(-4,4),y:s.y+rand(-4,4),vx:rand(-.5,.5),vy:-rand(.5,1.5),life:16,col:Math.random()<0.5?'#ffb030':'#ff5a1f',s:2.5});
  if(s.ty==='ice'&&Math.random()<0.3)parts.push({x:s.x,y:s.y,vx:rand(-.4,.4),vy:rand(-.4,.4),life:20,col:'#e0f6ff',s:1.6});
  if(s.x<AX0+8||s.x>AX1-8){s.vx*=-1;s.x=clamp(s.x,AX0+8,AX1-8);s.b--;}
  if(s.y<AY0+8||s.y>AY1-8){s.vy*=-1;s.y=clamp(s.y,AY0+8,AY1-8);s.b--;}
  for(const b of OBS){const dx=s.x-b.x,dy=s.y-b.y,d=Math.hypot(dx,dy)||1;if(d<b.r+8){if(b.box){hitBox(b,s.dmg);s.life=0;break;}const nx=dx/d,ny=dy/d,dot=s.vx*nx+s.vy*ny;if(dot<0){s.vx-=2*dot*nx;s.vy-=2*dot*ny;s.b--;}s.x=b.x+nx*(b.r+8);s.y=b.y+ny*(b.r+8);}}
  for(const e of enemies){if(!e.dead&&!s.hitIds.includes(e.id)&&Math.hypot(e.x-s.x,e.y-s.y)<e.r+9){P=s.owner;s.hitIds.push(e.id);hurtEnemy(e,s.dmg,s.vx*0.7,s.vy*0.7);
    if(s.ty==='ice'){e.ice=e.type==='boss'?45:110;e.stun=Math.max(e.stun,e.ice);burst(e.x,e.y,'#cdefff',10,3);}
    if(s.ty==='fire')burst(e.x,e.y,'#ff8a2a',10,3);
    if(s.ty==='bouncy'){s.hits++;if(s.hits>=4)s.life=0;}else{s.life=0;}
    break;}}
  if(s.life<=0||s.b<0){s.dead=true;const sticky=s.ty==='sticky';tangles.push({x:s.x,y:s.y,r:sticky?80:46,t:sticky?520:260,col:s.col,seed:Math.random()*99});}
 }
 shots=shots.filter(s=>!s.dead);
 for(const t of tangles)t.t-=f;tangles=tangles.filter(t=>t.t>0);

 for(const e of enemies){
  e.t+=f;if(e.hit>0)e.hit-=f;if(e.ice>0)e.ice-=f;if(e.hzcd>0)e.hzcd-=f;
  {let bd=1e9;for(const pl of PS){if(pl.down)continue;const q=Math.hypot(pl.x-e.x,pl.y-e.y);if(q<bd){bd=q;P=pl;}}}
  const dx=P.x-e.x,dy=P.y-e.y,d=Math.hypot(dx,dy)||1;
  let slow=1;for(const tg of tangles){if(Math.hypot(e.x-tg.x,e.y-tg.y)<tg.r+e.r*0.4){slow=0.33;break;}}
  if(e.type==='boss')slow=Math.max(slow,0.65);
  if(inPond(e.x,e.y))slow*=e.type==='duck'?1.6:0.55;
  let vx=0,vy=0;
  if(e.stun>0){e.stun-=f;if(e.state!==0){e.state=0;e.cd=90;}}
  else switch(e.ai){
   case 'chase':vx=dx/d*e.spd;vy=dy/d*e.spd;break;
   case 'zig':{const s=Math.sin(e.t*0.12)*1.3;vx=(dx/d-dy/d*s)*e.spd;vy=(dy/d+dx/d*s)*e.spd;break;}
   case 'shoot':{const want=230,g=d>want+30?1:d<want-30?-1:0;vx=dx/d*e.spd*g-dy/d*0.7;vy=dy/d*e.spd*g+dx/d*0.7;e.cd-=f;if(e.cd<=0&&e.in){e.cd=rand(110,170);eshot(e,e.type==='seahorse'?'bubble':'acorn',dx/d,dy/d,e.type==='seahorse'?4:5,e.dmg);snd(600,0.05,'square',0.02);}break;}
   case 'charge':
    if(e.state===0){vx=dx/d*e.spd;vy=dy/d*e.spd;e.cd-=f;if(d<270&&e.cd<=0&&e.in){e.state=1;e.st=38;snd(e.type==='goose'?900:120,0.2,'sawtooth',0.035,e.type==='goose'?-300:-30);}}
    else if(e.state===1){e.st-=f;if(e.st<=0){e.state=2;e.st=34;const v=e.type==='goose'?7.5:e.type==='bear'?6.5:6;e.vx=dx/d*v;e.vy=dy/d*v;}}
    else{vx=e.vx;vy=e.vy;e.st-=f;if(e.st<=0){e.state=0;e.cd=rand(90,150);}}
    break;
   case 'boss':
    if(e.state===0){vx=dx/d*e.spd;vy=dy/d*e.spd;e.cd-=f;
     if(e.cd<=0&&e.in){e.pat++;if(e.pat%3===0){e.state=1;e.st=50;floatText('GRRRR!',e.x,e.y-e.r-30,'#ff6b6b',26);snd(80,0.5,'sawtooth',0.07,-20);}
      else{const n=e.hp<e.max*0.5?7:5,base=Math.atan2(dy,dx);for(let a=0;a<n;a++){const ang=base+(a-(n-1)/2)*0.24;eshot(e,'bone',Math.cos(ang),Math.sin(ang),4.6,12);}e.cd=e.hp<e.max*0.5?85:115;snd(200,0.12,'square',0.04,-100);}}}
    else if(e.state===1){e.st-=f;if(e.st<=0){e.state=2;e.st=42;e.vx=dx/d*8;e.vy=dy/d*8;}}
    else{vx=e.vx;vy=e.vy;e.st-=f;if(e.st<=0){e.state=0;e.cd=90;}}
    if(e.hp<e.max*0.6){bossAdd-=f;if(bossAdd<=0){bossAdd=600;for(let k=0;k<1+PS.length;k++)spawnEnemy('pup');floatText('Get those cats, pups!',e.x,e.y-e.r-50,'#ffd23f',18);}}
    break;
  }
  e.x+=(vx*slow+e.kx)*f;e.y+=(vy*slow+e.ky)*f;
  const damp=Math.pow(0.84,f);e.kx*=damp;e.ky*=damp;
  e.mv=Math.hypot(vx,vy)>0.2;
  if(Math.abs(vx)>0.15)e.face=vx>0?1:-1;else if(e.ai==='shoot')e.face=dx>0?1:-1;
  if(!e.in&&e.x>AX0+e.r&&e.x<AX1-e.r&&e.y>AY0+e.r&&e.y<AY1-e.r)e.in=true;
  if(e.in){pushOut(e,e.r*0.8);e.x=clamp(e.x,AX0+e.r,AX1-e.r);e.y=clamp(e.y,AY0+e.r,AY1-e.r);}
  if(d<e.r+15&&e.stun<=0)hurtPlayer(e.dmg,-dx/d,-dy/d);
 }
 for(let i=0;i<enemies.length;i++)for(let j=i+1;j<enemies.length;j++){const a=enemies[i],b=enemies[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,m=a.r+b.r;if(d<m){const p=(m-d)/2*0.5;if(a.type!=='boss'){a.x-=dx/d*p;a.y-=dy/d*p;}if(b.type!=='boss'){b.x+=dx/d*p;b.y+=dy/d*p;}}}

 for(const s of eshots){s.x+=s.vx*f;s.y+=s.vy*f;s.rot+=0.25*f;s.life-=f;

 for(const p of pickups){p.t+=f;p.life-=f;

   score+=2;}}
 pickups=pickups.filter(p=>p.life>0);
 P=PS[0];tapped.clear();
}

function buy(it,kind,whoOverride){
 if(netMode==='guest'){gBuyN++;ROOMN.presence({buy:[gBuyN,kind,it?it.id:null]}).catch(()=>{});snd(700,0.06,'triangle',0.03);return;}
 const who=whoOverride!==undefined?whoOverride:Math.min(dressIdx,PS.length-1);
 const ok=(cost)=>{if(bank<cost){shopMsg={s:`Need ${cost-bank} more yarn balls!`,t:100};snd(150,0.12,'square',0.04);return false;}bank-=cost;return true;};
 const yay=(s)=>{shopMsg={s,t:110};snd(880,0.08,'triangle',0.05);setTimeout(()=>snd(1320,0.12,'triangle',0.05),80);burst(mouse.x>0?mouse.x:W/2,mouse.y>0?mouse.y:300,'#ffd23f',14,5);};
 const tag=PS.length>1?`P${who+1} `:'';
 if(kind==='gear'){const f=fits[who];
  if(owned[it.id]){f[it.slot]=f[it.slot]===it.id?undefined:it.id;if(!f[it.slot])delete f[it.slot];snd(700,0.08,'triangle',0.04);shopMsg={s:f[it.slot]?`${tag}is wearing the ${it.name}`:`${tag}took off the ${it.name}`,t:90};refreshHp(who);return;}
  if(!ok(it.cost))return;owned[it.id]=true;f[it.slot]=it.id;refreshHp(who);yay(`${tag}Got the ${it.name}! ${it.desc}`);return;}
 if(kind==='yarn'){
  if(ownedYarn[it.id]){yarnType=it.id;shopMsg={s:`Now throwing ${it.name}!`,t:90};snd(700,0.08,'triangle',0.04);return;}
  if(!ok(it.cost))return;ownedYarn[it.id]=true;yarnType=it.id;yay(`Got ${it.name}! The whole team throws it now.`);return;}
 if(kind==='pack'){if(!ok(3))return;PS.forEach(p=>p.yarn=Math.min(40,p.yarn+10));yay('+10 throwing yarn for '+(PS.length>1?'everyone':'you')+'!');return;}
 if(!it)return;

}
function refreshHp(k){const p=PS[k];if(!p)return;const m=maxHp(p.cat,k);p.hp=Math.min(m,p.hp+Math.max(0,m-p.max));p.max=m;}

   if(multi)txt(lab,Q.x,Q.y-(fits[Q.id]&&fits[Q.id].head?66:48),14,PCOL[Q.id]);
   if(Q.shield>0){const g=ctx.createRadialGradient(Q.x,Q.y-2,20,Q.x,Q.y-2,38);g.addColorStop(0,'rgba(143,211,255,0)');g.addColorStop(1,'rgba(143,211,255,.35)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(Q.x,Q.y-2,38,0,7);ctx.fill();ctx.strokeStyle='rgba(200,235,255,.8)';ctx.lineWidth=2;ctx.stroke();}
   if(Q.atkAnim>0){const a=Math.atan2(Q.ay,Q.ax),k=Q.atkAnim/10;ctx.save();ctx.translate(Q.x,Q.y-4);ctx.rotate(a);ctx.globalAlpha=k;ctx.strokeStyle=Q.frenzy>0?'#ff8080':'#ffffff';ctx.lineCap='round';for(let i=-1;i<=1;i++){ctx.lineWidth=3.5-Math.abs(i);ctx.beginPath();ctx.arc(0,0,42+i*9,-1.0+(1-k)*0.6,1.0-(1-k)*0.3);ctx.stroke();}ctx.restore();}
  }else drawEnemy(it.e);
 }
 drawCanopies();
 for(const s of shots){const col=s.ty==='rainbow'?YARNCOLS[Math.floor(T/5+s.x)%YARNCOLS.length]:s.col;if(s.ty==='fire'){const g=ctx.createRadialGradient(s.x,s.y,2,s.x,s.y,18);g.addColorStop(0,'rgba(255,170,60,.6)');g.addColorStop(1,'rgba(255,90,20,0)');ctx.fillStyle=g;ell(ctx,s.x,s.y,18,18);}drawYarn(s.x,s.y,9,col,s.rot);if(s.ty==='ice'){ctx.strokeStyle='rgba(235,250,255,.9)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(s.x,s.y,11,0,7);ctx.stroke();}}
 for(const s of eshots){if(s.kind==='bone')drawBone(s.x,s.y,s.rot,1.1);else if(s.kind==='bubble')drawBubble(s.x,s.y);else drawAcorn(s.x,s.y,s.rot);}
 for(const p of parts){ctx.globalAlpha=Math.min(1,p.life/20);if(p.ring){ctx.strokeStyle=p.col;ctx.lineWidth=5;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.stroke();}else if(p.heart){txt('♥',p.x,p.y,16,p.col,'center',false);}else{ctx.fillStyle=p.col;ell(ctx,p.x,p.y,p.s,p.s);}ctx.globalAlpha=1;}
 drawHazardOver();if(HZ.k==='dark')drawDarkness();drawAmbient();
 for(const t of texts){ctx.globalAlpha=clamp(t.t/20,0,1);txt(String(t.s),t.x,t.y,t.size,t.col);ctx.globalAlpha=1;}
 ctx.restore();
 drawHUD();
 if(banner&&banner.t>0){const a=Math.min(1,banner.t/20,(140-banner.t)/15+1);ctx.globalAlpha=clamp(a,0,1);txt(banner.txt,W/2,H/2-30,52,'#ffd23f');if(banner.sub)txt(banner.sub,W/2,H/2+22,24,'#fff');ctx.globalAlpha=1;}
 if(isTouch&&state==='play'&&!paused)drawTouch();
}
function playerPanel(Q,x,w){
 const multi=PS.length>1,big=!multi;
 if(multi){ctx.fillStyle=PCOL[Q.id]+'2a';rr(ctx,x+2,4,w-4,58,10);ctx.fill();}
 drawCat(ctx,Q.cat,x+30,44,0.85,1,T,false,Q.down?0.4:1,fits[Q.id],KNIT[Q.id]);
 const bx=x+60,bw=big?170:w-70;
 const name=(multi?(netMode!=='local'&&Q.id===meIdx()?'YOU ':'P'+(Q.id+1)+' '):'')+Q.cat.name+(Q.down?' (napping)':'');
 txt(name,bx,15,15,multi?PCOL[Q.id]:'#ffd23f','left',false);
 ctx.fillStyle='rgba(255,255,255,.15)';rr(ctx,bx,25,bw,13,6);ctx.fill();
 const hp=Q.hp/Q.max;ctx.fillStyle=hp>0.5?'#5fd36b':hp>0.25?'#ffb23f':'#ff5d5d';if(Q.hp>0){rr(ctx,bx,25,Math.max(6,bw*hp),13,6);ctx.fill();}
 txt(Math.ceil(Q.hp)+' / '+Q.max,bx+bw/2,32,11,'#fff','center',false);
 const ready=Q.sp>=Q.spMax;
 if(big){
  drawYarn(282,34,12,'#c8344f',0.3);txt('× '+Q.yarn,302,35,22,Q.yarn?'#fff':'#ff8a8a','left',false);
  const sx=370;txt('★ '+SPECIALS[Q.cat.special].name+(ready?(isTouch?'  READY!':'  READY! [L]'):''),sx,15,15,ready?'#ffe14d':'#cfc3ef','left',false);
  ctx.fillStyle='rgba(255,255,255,.15)';rr(ctx,sx,25,200,13,6);ctx.fill();
  ctx.fillStyle=ready?(Math.floor(T/8)%2?'#ffe14d':'#ffb23f'):'#b58cff';rr(ctx,sx,25,Math.max(6,200*Q.sp/Q.spMax),13,6);ctx.fill();
  let fx=sx+214;
  if(Q.nip>0){txt('🌿',fx,32,15,'#7be08d','left',false);fx+=30;}
  if(Q.shield>0){txt('🛡',fx,32,15,'#8fd3ff','left',false);fx+=30;}
  if(Q.frenzy>0){txt('🔥',fx,32,15,'#ff8080','left',false);}
 }else{
  drawYarn(bx+6,51,6,'#c8344f',0.3);txt('×'+Q.yarn,bx+15,51,13,Q.yarn?'#fff':'#ff8a8a','left',false);
  const sx=bx+44,sw=bw-44;ctx.fillStyle='rgba(255,255,255,.15)';rr(ctx,sx,46,sw,10,5);ctx.fill();
  ctx.fillStyle=ready?(Math.floor(T/8)%2?'#ffe14d':'#ffb23f'):'#b58cff';rr(ctx,sx,46,Math.max(5,sw*Q.sp/Q.spMax),10,5);ctx.fill();
  if(ready)txt('★',sx+sw-6,51,12,'#fff','center',false);
 }
}
function drawHUD(){
 const g=ctx.createLinearGradient(0,0,0,AY0-12);g.addColorStop(0,'rgba(20,12,40,.92)');g.addColorStop(1,'rgba(30,18,55,.85)');ctx.fillStyle=g;ctx.fillRect(0,0,W,AY0-12);
 const L=LEVELS[levelIdx],multi=PS.length>1;
 if(multi){const area=W-220,pw=area/PS.length;PS.forEach((p,k)=>playerPanel(p,k*pw,pw));}
 else if(PS[0])playerPanel(PS[0],0,W);
 txt(`Lv ${levelIdx+1}: ${L.name}`,W-68,17,multi?13:15,'#fff','right',false);
 txt(`Wave ${Math.max(1,Math.min(waveIdx+1,L.waves.length))}/${L.waves.length}   🐱 ${KITS.filter(k=>k.saved).length}/${KITS.length}   🧶 ${bank}`+(multi?'':`   Score ${score}`),W-68,36,multi?13:15,'#ffd23f','right',false);
 if(multi)txt(`Score ${score}`+(netMode!=='local'?'  · 🌐 '+roomCode:''),W-68,53,13,'#ffd23f','right',false);
 ctx.fillStyle='rgba(255,255,255,.18)';ell(ctx,W-34,32,20,20);ctx.fillStyle='#fff';ctx.fillRect(W-41,23,5,18);ctx.fillRect(W-32,23,5,18);
 if(netMode!=='guest')buttons.push({x:W-56,y:10,w:44,h:44,cb:()=>{paused=!paused;}});
 const boss=enemies.find(e=>e.type==='boss');
 if(boss){const bw=420,bx=W/2-bw/2,by=H-44;ctx.fillStyle='rgba(0,0,0,.55)';rr(ctx,bx-4,by-4,bw+8,24,10);ctx.fill();const bg=ctx.createLinearGradient(0,by,0,by+16);bg.addColorStop(0,'#ff6d80');bg.addColorStop(1,'#c02040');ctx.fillStyle=bg;rr(ctx,bx,by,Math.max(4,bw*boss.hp/boss.max),16,8);ctx.fill();txt('👑 KING REX',W/2,by-14,16,'#ffd23f');}
}
function drawTouch(){
 const Q=PS[meIdx()]||PS[0];
 const j=touch.joy,cx=j?j.cx:120,cy=j?j.cy:H-120;
 ctx.globalAlpha=j?0.5:0.25;ctx.fillStyle='#fff';ell(ctx,cx,cy,58,58);ctx.globalAlpha=0.75;ell(ctx,cx+touch.jx*42,cy+touch.jy*42,26,26);ctx.globalAlpha=1;
 for(const k in TB){const b=TB[k],on=touch.btn[k]!==null;const col=k==='claw'?'#e05a80':k==='yarn'?'#3a9ad0':(Q&&Q.sp>=Q.spMax?'#e0b030':'#6a5b90');
  ctx.globalAlpha=on?0.95:0.6;ctx.fillStyle=col;ell(ctx,b.x,b.y,b.r,b.r);ctx.globalAlpha=1;
  txt(k==='yarn'?'YARN '+(Q?Q.yarn:0):b.label,b.x,b.y,k==='special'?26:15,'#fff');}
}
function overlay(title,sub,col='#ffd23f'){ctx.fillStyle='rgba(14,8,30,.74)';ctx.fillRect(0,0,W,H);txt(title,W/2,160,58,col);if(sub)txt(sub,W/2,222,21,'#fff');}
function render(){
 buttons=[];
 ctx.setTransform(DPR,0,0,DPR,0,0);
 const guest=netMode==='guest';
 if(state==='title')drawTitle();
 else if(state==='online')drawOnline();
 else if(state==='joinCode')drawJoinCode();
 else if(state==='select')drawSelect();
 else if(state==='hostLobby')drawHostLobby();
 else if(state==='guestWait')drawGuestWait();
 else if(state==='shop')drawShop();
 else if(PS.length){
  drawGame();
  const team=PS.length>1?'Your team':PS[0].cat.name;
  if(state==='play'&&paused){overlay('Paused',guest?'The host paused the game.':'Take a cat nap.');
   if(!guest){btn(W/2-120,262,240,62,'Resume',()=>{paused=false;},'#3fa85a',true,28);btn(W/2-120,338,240,52,netMode==='host'?'End Online Game':'Main Menu',()=>{paused=false;if(netMode==='host')leaveNet();else state='title';},'#6a5b90',false,20);}
   else btn(W/2-90,300,180,50,'Leave',()=>leaveNet(),'#6a5b90',false,20);
   if(netMode==='local')PS.forEach((p,k)=>txt((PS.length>1?`P${k+1} ${p.cat.name}: `:'')+ctrlOf(k).label,W/2,430+k*26,15,PS.length>1?PCOL[k]:'#fff','center',false));
   else txt('Your keys: '+CTRL1.label,W/2,430,15,'#fff','center',false);}
  if(state==='gameover'){overlay('Oh no!',`${team} got tuckered out on ${LEVELS[levelIdx].name}.`,'#ff6b6b');
   PS.forEach((p,k)=>drawCat(ctx,p.cat,W/2+(k-(PS.length-1)/2)*110,300,2.1,1,0,false,0.8,fits[k],KNIT[k]));txt('z z z',W/2+PS.length*55+40,258,22,'#cfc3ef');
   if(guest){txt('Waiting for the host…',W/2,400,20,'#ffd23f');btn(W/2-90,440,180,50,'Leave',()=>leaveNet(),'#6a5b90',false,20);}
   else{btn(W/2-370,380,230,62,'Try Again',()=>{const s=score;startLevel(levelIdx);score=s;},'#3fa85a',true,24);
    if(netMode==='local')btn(W/2-115,380,230,62,'Switch Cats',()=>{continuing=true;startAt=levelIdx;picks=[];pickTurn=0;sel=0;state='select';},'#e05a80',false,24);
    btn(W/2+140,380,230,62,'Main Menu',()=>{if(netMode==='host')leaveNet();else state='title';},'#6a5b90',false,24);}}
  if(state==='win'){overlay('YOU WIN!',`${team} defeated King Rex and saved all the yarn!`);
   PS.forEach((p,k)=>drawCat(ctx,p.cat,W/2+(k-(PS.length-1)/2)*120,320+Math.abs(Math.sin(T*0.1+k))*-14,2,1,T+k*5,false,1,fits[k],KNIT[k]));
   txt(`Final score: ${score}`+(score>=best?'  ★ New best!':`   (best ${best})`),W/2,400,26,'#ffd23f');if(kitsSaved)txt(`Kittens rescued: ${kitsSaved} 🐱`,W/2,425,17,'#ffb3d0','center',false);
   btn(W/2-130,440,260,62,guest?'Leave':'Play Again',()=>{if(netMode!=='local')leaveNet();else state='title';},'#e05a80',true,26);
   if(Math.random()<0.3)parts.push({x:rand(0,W),y:-10,vx:rand(-1,1),vy:rand(2,4),life:200,col:YARNCOLS[Math.floor(Math.random()*YARNCOLS.length)],s:4});}
 }else{bgPattern();txt('Loading…',W/2,H/2,30);}
 if(state!=='play')for(const p of parts){ctx.globalAlpha=Math.min(1,p.life/20);if(!p.ring&&!p.heart){ctx.fillStyle=p.col;ell(ctx,p.x,p.y,p.s,p.s);}ctx.globalAlpha=1;}
 focusHint();
}

/* ================= input ================= */
function onKey(code){
 if(state==='joinCode'){
  if(/^Key[A-Z]$/.test(code)&&codeIn.length<4){const ch=code.slice(3);if('ABCDEFGHJKLMNPQRSTUVWXYZ'.includes(ch))codeIn+=ch;return;}
  if(code==='Backspace'){codeIn=codeIn.slice(0,-1);return;}
  if(code==='Enter'){joinGame(codeIn);return;}
  if(code==='Escape'){state='online';return;}
  return;
 }
 if(code==='KeyM'&&state!=='play'){muted=!muted;return;}
 if(state==='play'){
  if(netMode==='guest'){if(CTRL1.special.includes(code))guestSpecial();return;}
  if(code==='KeyP'||code==='Escape'){paused=!paused;return;}
  if(paused){if(code==='Enter')paused=false;return;}
  for(const pl of PS){if(!pl.down&&!pl.remote&&ctrlOf(pl.id).special.includes(code)){P=pl;special();}}
  P=PS[0];
  return;
 }
 if(state==='select'){
  const step=d=>{let s=sel;for(let k=0;k<12;k++){s=(s+d+12)%12;if(!(netMode==='local'&&picks.includes(s)))break;}sel=s;};
  if(code==='ArrowRight'||code==='KeyD')step(1);
  if(code==='ArrowLeft'||code==='KeyA')step(-1);
  if(code==='ArrowDown'||code==='KeyS'||code==='ArrowUp'||code==='KeyW'){const n=(sel+6)%12;if(!(netMode==='local'&&picks.includes(n)))sel=n;}
  if(code==='Enter'||code==='Space')playSel();
  return;
 }
 if(state==='title'){if(/^Digit[1-4]$/.test(code)){goSelect(+code.slice(5));return;}if(code==='KeyO'){state='online';return;}}
 if(code==='Enter'||code==='Space'){const b=buttons.find(b=>b.primary);if(b)b.cb();}
}
addEventListener('keydown',e=>{
 const gameKeys=['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Slash','Period','Quote','Backspace','Tab'];
 if(gameKeys.includes(e.code))e.preventDefault();
 if(e.repeat){keys[e.code]=true;return;}
 keys[e.code]=true;tapped.add(e.code);onKey(e.code);
});
addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;if(state==='play'&&netMode==='local')paused=true;});
function toLocal(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
cv.addEventListener('pointerdown',e=>{
 if(e.pointerType==='touch')e.preventDefault();
 try{window.focus();cv.focus({preventScroll:true});}catch(err){}
 const p=toLocal(e);
 if(e.pointerType==='touch'&&!isTouch)isTouch=true;
 if(e.pointerType!=='touch'){mouse.x=p.x;mouse.y=p.y;}
 snd(1,0.001,'sine',0.0001);
 for(let i=buttons.length-1;i>=0;i--){const b=buttons[i];if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h){b.cb();return;}}
 if(state==='title'&&p.x>W-70&&p.y<50){muted=!muted;return;}
 if(state!=='play'||paused)return;
 const Q=PS[meIdx()];if(!Q||Q.down)return;
 if(e.pointerType==='touch'){
  for(const k in TB){const b=TB[k];if(Math.hypot(p.x-b.x,p.y-b.y)<b.r+12){touch.btn[k]=e.pointerId;
   if(netMode==='guest'){if(k==='special')guestSpecial();if(k==='yarn')guestThrow(Q.ax,Q.ay);}
   else{P=Q;if(k==='special')special();if(k==='yarn')throwYarn(P.ax,P.ay);if(k==='claw')claw();P=PS[0];}
   return;}}
  if(p.x<W*0.55&&!touch.joy){touch.joy={id:e.pointerId,cx:p.x,cy:Math.max(p.y,AY0+60)};touch.jx=touch.jy=0;}
 }else{
  if(netMode==='guest')guestThrow(p.x-Q.x,p.y-Q.y);
  else{P=Q;throwYarn(p.x-Q.x,p.y-Q.y);P=PS[0];}
 }
});
addEventListener('pointermove',e=>{const p=toLocal(e);if(e.pointerType!=='touch'){mouse.x=p.x;mouse.y=p.y;}
 if(touch.joy&&e.pointerId===touch.joy.id){let dx=p.x-touch.joy.cx,dy=p.y-touch.joy.cy;const d=Math.hypot(dx,dy);if(d>42){dx=dx/d*42;dy=dy/d*42;}touch.jx=dx/42;touch.jy=dy/42;if(Math.hypot(touch.jx,touch.jy)<0.15){touch.jx=0;touch.jy=0;}}});
function endPointer(e){if(touch.joy&&e.pointerId===touch.joy.id){touch.joy=null;touch.jx=touch.jy=0;}for(const k in touch.btn)if(touch.btn[k]===e.pointerId)touch.btn[k]=null;}
addEventListener('pointerup',endPointer);addEventListener('pointercancel',endPointer);
cv.addEventListener('contextmenu',e=>e.preventDefault());
try{window.focus();cv.focus({preventScroll:true});}catch(e){}

/* ================= loop ================= */
let last=performance.now();
function loop(now){const f=Math.min(3,(now-last)/16.667);last=now;try{update(f);render();}catch(err){console.error(err);}requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script>
